<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mot fléché — Le mot mystère</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2430;
    --card:#232f3f;
    --card-2:#2b3a4d;
    --ink:#eef1f4;
    --ink-dim:#9fb0c2;
    --escalade:#5f9ea8;
    --cuisine:#e0972c;
    --gold:#e8c468;
    --green:#4caf7d;
    --red:#e0645f;
    --line:#324256;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #2a3849 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px calc(env(safe-area-inset-bottom,0) + 12px);
  }
  .wrap{width:100%;max-width:460px;}

  header{text-align:center;margin-bottom:14px;}
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    margin:4px 0 0;
    font-weight:700;
  }
  header h1 span{color:var(--gold);}

  /* Mystery word strip — carabiner rings on a rope */
  .mystery{
    position:relative;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:16px 8px;
    margin:14px 0 18px;
  }
  .mystery::before{
    content:"";
    position:absolute;
    top:50%;left:6%;right:6%;
    height:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);
    transform:translateY(-1px);
    z-index:0;
  }
  .ring{
    position:relative;z-index:1;
    width:36px;height:36px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:16px;
    color:var(--ink-dim);
    transition:.25s;
  }
  .ring.found{
    border-color:var(--gold);
    background:linear-gradient(160deg,#3a3120,#2b2618);
    color:var(--gold);
    box-shadow:0 0 0 3px rgba(232,196,104,.15);
  }

  .word-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .word-row .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:7px;
  }
  .tag.escalade{background:rgba(95,158,168,.16);color:var(--escalade);}
  .tag.cuisine{background:rgba(224,151,44,.16);color:var(--cuisine);}

  .clue{font-size:14px;line-height:1.35;color:var(--ink);margin-bottom:9px;}
  .clue .arrow{color:var(--ink-dim);margin-right:2px;}

  .boxes{display:flex;gap:5px;flex-wrap:wrap;}
  .cell{
    width:29px;height:34px;
    border-radius:7px;
    background:var(--card-2);
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:16px;
    color:var(--ink);
    cursor:pointer;
    transition:.15s;
  }
  .cell.target{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(232,196,104,.4);}
  .cell.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12);}
  .word-row.correct .cell{border-color:var(--green);background:rgba(76,175,125,.14);}
  .word-row.wrong .cell{border-color:var(--red);}

  .status-line{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin:10px 0 4px;
    min-height:16px;
  }

  #win{
    display:none;
    text-align:center;
    background:linear-gradient(160deg,#2b2618,#1e2530);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:16px;
    margin:6px 0 14px;
  }
  #win h2{
    font-family:'Space Grotesk',sans-serif;
    color:var(--gold);
    margin:0 0 4px;
    font-size:20px;
  }
  #win p{margin:0;color:var(--ink-dim);font-size:13px;}

  .reset{
    display:block;
    margin:6px auto 12px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }

  /* Virtual keyboard */
  #keyboard{
    position:sticky;
    bottom:0;
    width:100%;
    max-width:460px;
    background:linear-gradient(180deg, rgba(27,36,48,0) 0%, var(--bg) 18%);
    padding-top:8px;
    margin-top:auto;
  }
  .kb-row{display:flex;justify-content:center;gap:4px;margin-bottom:6px;}
  .key{
    flex:1;
    max-width:34px;
    height:42px;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .key:active{background:var(--card);}
  .key.wide{max-width:52px;font-size:11px;color:var(--ink-dim);}

  .conn{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-dim);
    opacity:.7;
    margin-bottom:6px;
  }
  .conn.on::before{content:"● ";color:var(--green);}
  .conn.off::before{content:"● ";color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Mot fléché collaboratif</div>
    <h1>Escalade & Cuisine — trouvez le mot <span>mystère</span></h1>
  </header>

  <div class="mystery" id="mystery"></div>

  <div id="grille"></div>

  <div class="status-line" id="statusLine"></div>

  <div id="win">
    <h2>🏝️ Le mot mystère : ACORES</h2>
    <p>Bravo, la grille est complète !</p>
  </div>

  <button class="reset" id="resetBtn">↺ Réinitialiser la grille</button>
  <div class="conn off" id="connStatus">connexion…</div>
</div>

<div id="keyboard"></div>

<!-- Firebase (compat SDK, pas de build nécessaire) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1) CONFIGURATION FIREBASE — à remplacer par la vôtre
   (Console Firebase > Paramètres du projet > Vos applications > Config)
   ============================================================ */
const firebaseConfig = {
  apiKey: "VOTRE_API_KEY",
  authDomain: "VOTRE_PROJET.firebaseapp.com",
  databaseURL: "https://VOTRE_PROJET-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "VOTRE_PROJET",
  storageBucket: "VOTRE_PROJET.appspot.com",
  messagingSenderId: "VOTRE_SENDER_ID",
  appId: "VOTRE_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cellsRef = db.ref('motfleche/cellules'); // ex: motfleche/cellules/0_1 = "A"

/* ============================================================
   2) LES MOTS DE LA GRILLE
   target = index (0-based) de la lettre qui sert au mot mystère
   la suite des lettres cibles (dans l'ordre des mots) = A C O R E S
   ============================================================ */
const words = [
  { cat:'escalade', label:'Escalade', clue:"Équipement qui enserre la taille et les cuisses pour s'encorder", answer:'BAUDRIER', target:1 },
  { cat:'cuisine',  label:'Cuisine',  clue:"Retirer l'écume qui se forme à la surface d'un bouillon", answer:'ECUMER', target:1 },
  { cat:'escalade', label:'Escalade', clue:"Anneau métallique à ouverture rapide utilisé pour s'assurer", answer:'MOUSQUETON', target:1 },
  { cat:'cuisine',  label:'Cuisine',  clue:"Mélange cuit de farine et de beurre qui sert à lier une sauce", answer:'ROUX', target:0 },
  { cat:'escalade', label:'Escalade', clue:"Pan de paroi qui penche vers l'arrière, plus dur à grimper", answer:'DEVERS', target:1 },
  { cat:'cuisine',  label:'Cuisine',  clue:"Cuire à feu vif pour colorer rapidement la surface d'un aliment", answer:'SAISIR', target:0 },
];
const mysteryWord = words.map(w => w.answer[w.target]).join(''); // ACORES

/* ============================================================
   3) RENDU DE LA GRILLE
   ============================================================ */
const grilleEl = document.getElementById('grille');
const mysteryEl = document.getElementById('mystery');
const statusLine = document.getElementById('statusLine');
const winEl = document.getElementById('win');
const connEl = document.getElementById('connStatus');

let current = { word: 0, letter: 0 };
let localData = {}; // cache local des cellules { "w_l": "A" }

words.forEach((w, wi) => {
  mysteryEl.insertAdjacentHTML('beforeend', `<div class="ring" id="ring-${wi}">?</div>`);

  const row = document.createElement('div');
  row.className = 'word-row';
  row.id = `row-${wi}`;
  row.innerHTML = `
    <span class="tag ${w.cat}">${w.cat === 'escalade' ? '🧗' : '🍳'} ${w.label}</span>
    <div class="clue"><span class="arrow">➜</span>${w.clue}</div>
    <div class="boxes">
      ${w.answer.split('').map((_, li) => `
        <div class="cell${li === w.target ? ' target' : ''}" id="cell-${wi}-${li}" data-w="${wi}" data-l="${li}"></div>
      `).join('')}
    </div>
  `;
  grilleEl.appendChild(row);
});

grilleEl.addEventListener('click', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  setActive(parseInt(cell.dataset.w), parseInt(cell.dataset.l));
});

function setActive(w, l) {
  document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
  current = { word: w, letter: l };
  document.getElementById(`cell-${w}-${l}`)?.classList.add('active');
}
setActive(0, 0);

/* ============================================================
   4) CLAVIER VIRTUEL AZERTY
   ============================================================ */
const rows = [
  ['A','Z','E','R','T','Y','U','I','O','P'],
  ['Q','S','D','F','G','H','J','K','L','M'],
  ['⌫','W','X','C','V','B','N','→']
];
const kb = document.getElementById('keyboard');
rows.forEach(r => {
  const rowEl = document.createElement('div');
  rowEl.className = 'kb-row';
  r.forEach(k => {
    const key = document.createElement('div');
    key.className = 'key' + (k === '⌫' || k === '→' ? ' wide' : '');
    key.textContent = k;
    key.addEventListener('click', () => handleKey(k));
    rowEl.appendChild(key);
  });
  kb.appendChild(rowEl);
});

function handleKey(k) {
  const w = words[current.word];
  if (k === '⌫') {
    writeCell(current.word, current.letter, '');
    moveTo(current.word, current.letter - 1);
  } else if (k === '→') {
    moveTo(current.word, current.letter + 1, true);
  } else {
    writeCell(current.word, current.letter, k);
    moveTo(current.word, current.letter + 1, true);
  }
}

function moveTo(w, l, wrapToNextWord) {
  if (l < 0) { l = 0; }
  if (l >= words[w].answer.length) {
    if (wrapToNextWord && w < words.length - 1) { w = w + 1; l = 0; }
    else { l = words[w].answer.length - 1; }
  }
  setActive(w, l);
}

function writeCell(w, l, val) {
  cellsRef.child(`${w}_${l}`).set(val.toUpperCase());
}

/* ============================================================
   5) SYNCHRONISATION TEMPS RÉEL (Firebase)
   ============================================================ */
cellsRef.on('value', (snapshot) => {
  localData = snapshot.val() || {};
  render();
});

db.ref('.info/connected').on('value', (snap) => {
  connEl.textContent = snap.val() ? 'connecté en temps réel' : 'connexion…';
  connEl.className = 'conn ' + (snap.val() ? 'on' : 'off');
});

function render() {
  let allCorrect = true;
  words.forEach((w, wi) => {
    let filled = '';
    w.answer.split('').forEach((_, li) => {
      const val = localData[`${wi}_${li}`] || '';
      filled += val;
      const cellEl = document.getElementById(`cell-${wi}-${li}`);
      if (cellEl) cellEl.textContent = val;
    });

    const rowEl = document.getElementById(`row-${wi}`);
    const isFull = filled.length === w.answer.length;
    const isCorrect = filled === w.answer;
    rowEl.classList.toggle('correct', isCorrect);
    rowEl.classList.toggle('wrong', isFull && !isCorrect);
    if (!isCorrect) allCorrect = false;

    const ring = document.getElementById(`ring-${wi}`);
    if (isCorrect) {
      ring.textContent = w.answer[w.target];
      ring.classList.add('found');
    } else {
      ring.textContent = '?';
      ring.classList.remove('found');
    }
  });

  if (allCorrect) {
    winEl.style.display = 'block';
    statusLine.textContent = '';
  } else {
    winEl.style.display = 'none';
    const found = words.filter((w, wi) => {
      const filled = w.answer.split('').map((_, li) => localData[`${wi}_${li}`] || '').join('');
      return filled === w.answer;
    }).length;
    statusLine.textContent = `${found} / ${words.length} mots trouvés`;
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Réinitialiser la grille pour tout le monde ?')) {
    cellsRef.remove();
    setActive(0, 0);
  }
});
</script>
</body>
</html>
