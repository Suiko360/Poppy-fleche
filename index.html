<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mots Fléchés Interconnectés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2430;
    --card:#232f3f;
    --card-2:#2b3a4d;
    --ink:#eef1f4;
    --ink-dim:#9fb0c2;
    --gold:#e8c468;
    --green:#4caf7d;
    --line:#324256;
    --clue-bg:#263445;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  input, textarea{-webkit-user-select:text;user-select:text;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    height:100vh;height:100dvh;overflow:hidden;
  }
  body{display:flex;flex-direction:column;overscroll-behavior:none;}
  
  /* Lock Screen */
  #lock-screen {
    position:fixed;inset:0;background:var(--bg);z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box {
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px;text-align:center;width:100%;max-width:320px;box-shadow:0 10px 25px rgba(0,0,0,0.3);
  }
  .lock-box h2{font-family:'Space Grotesk',sans-serif;margin:0 0 10px;font-size:20px;color:var(--gold);}
  .lock-box p{font-size:13px;color:var(--ink-dim);margin-bottom:20px;}
  .code-inputs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
  .code-inputs input{
    width:55px;height:48px;background:var(--card-2);border:1px solid var(--line);
    border-radius:8px;color:#fff;text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:18px;font-weight:700;
  }
  .lock-btn{
    width:100%;background:var(--gold);color:#121820;border:none;padding:12px;
    border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
  }
  .lock-error{color:#e0645f;font-size:12px;margin-top:10px;display:none;}

  /* Floating Progress Bar */
  .top-bar {
    flex-shrink:0;
    background:rgba(27,36,48,0.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:8px 14px;display:none;
  }
  .progress-info{display:flex;justify-content:space-between;font-size:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:6px;}
  .progress-bg{width:100%;height:8px;background:var(--card-2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg, var(--gold), var(--green));transition:width 0.3s ease;}

  .mystery-row{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  .mring{
    width:24px;height:24px;border-radius:50%;
    background:var(--card-2);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;color:var(--ink-dim);
    transition:.25s;
  }
  .mring.found{
    border-color:var(--gold);background:linear-gradient(160deg,#3a3120,#2b2618);
    color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,104,.15);
  }

  /* Main Container — occupe tout l'espace restant, seule la grille scrolle */
  .wrap{
    flex:1;min-height:0;width:100%;
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;padding:8px 4px 4px;
  }
  header{text-align:center;margin-bottom:6px;flex-shrink:0;}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;font-weight:700;}

  /* Grid Layout — rendu "mots fléchés" façon appli mobile */
  .grid-scroll{
    flex:1;min-height:0;width:100%;
    overflow:auto;display:flex;justify-content:flex-start;align-items:flex-start;
    -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
  }
  #grid{display:grid;gap:2px;margin:8px auto;width:max-content;background:var(--bg);padding:2px;border-radius:10px;}

  .cell{
    width:33px;height:33px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
    position:relative;user-select:none;touch-action:manipulation;
  }

  /* Cases-lettres : bleu plein, lettre blanche, léger relief */
  .cell.letter{
    background:linear-gradient(180deg,#5f8ce9 0%,#3f6bd6 100%);
    color:#ffffff;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:background 0.15s, box-shadow 0.15s;
  }
  .cell.blocked{background:transparent;box-shadow:none;}

  /* Cases-indices : gris-ardoise, texte clair, petite puce-flèche bleue */
  .cell.clue-cell{
    background:linear-gradient(180deg,#3d4a5e 0%,#2c3745 100%);
    font-size:6.8px;line-height:1.1;text-align:center;padding:2px;
    color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.01em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    word-break:break-word;cursor:default;
    box-shadow:0 2px 0 rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .cell.clue-cell.locked{
    background:linear-gradient(180deg,#30384a 0%,#232a38 100%);
    opacity:.75;
  }
  .lock-icon{font-size:12px;}
  @keyframes unlockPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); box-shadow:0 0 0 4px rgba(232,196,104,.35); }
    100%{ transform:scale(1); }
  }
  .cell.clue-cell.unlocked{ animation:unlockPop 0.6s ease; }
  .clue-arrow{
    position:absolute;
    width:13px;height:13px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#5f8ce9,#3f6bd6);
    color:#fff;font-size:9px;font-weight:700;
    border-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  /* position de la puce selon le sens de lecture */
  .cell.clue-cell[data-arrow="→"] .clue-arrow{right:2px;bottom:2px;}
  .cell.clue-cell[data-arrow="↓"] .clue-arrow{right:2px;bottom:2px;}
  .cell.clue-cell[data-arrow="←"] .clue-arrow{left:2px;bottom:2px;}
  .cell.clue-cell[data-arrow="↑"] .clue-arrow{right:2px;top:2px;}

  /* case-lettre spéciale (mot mystère / lettre cible) */
  .cell.letter.target{
    background:linear-gradient(180deg,#f5b94a 0%,#e0972c 100%);
    box-shadow:0 2px 0 rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .mystery-badge{
    position:absolute;top:-5px;right:-5px;
    width:15px;height:15px;border-radius:50%;
    background:#1b2430;border:1.5px solid var(--gold);
    color:var(--gold);font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    z-index:3;line-height:1;
  }

  .cell.active{
    box-shadow:0 0 0 3px #ffffff, 0 2px 0 rgba(0,0,0,0.28);
    z-index:2;
  }
  .cell.wordlit:not(.active){
    box-shadow:0 0 0 2px rgba(255,255,255,0.55), 0 2px 0 rgba(0,0,0,0.28);
  }
  .cell.correct{
    box-shadow:0 0 0 2px var(--green), 0 2px 0 rgba(0,0,0,0.28);
  }

  /* Animation "mot trouvé" */
  @keyframes wordFound{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.22) rotate(-3deg); filter:brightness(1.5); }
    60%{ transform:scale(0.92) rotate(2deg); }
    100%{ transform:scale(1) rotate(0deg); filter:brightness(1); }
  }
  .cell.pop{ animation:wordFound 0.55s ease; }

  .confetti-piece{
    position:fixed; top:0; left:0; width:7px;height:7px;
    border-radius:2px; pointer-events:none; z-index:9998;
    will-change:transform, opacity;
  }
  @keyframes confettiFly{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.6); opacity:0; }
  }

  #win{display:none;flex-shrink:0;text-align:center;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin:6px 0 2px;width:100%;max-width:400px;}
  #win h2{font-family:'Space Grotesk',sans-serif;color:var(--gold);margin:0 0 2px;font-size:16px;}

  .reset{flex-shrink:0;align-self:center;display:block;margin:6px auto 8px;background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 10px;border-radius:16px;cursor:pointer;z-index:600;}

  /* Keyboard — élément flex normal, toujours ancré en bas de l'écran */
  #keyboard{flex-shrink:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,4px) + 4px);}
  .kb-row{display:flex;justify-content:center;gap:3px;margin-bottom:4px;}
  .key{flex:1;max-width:34px;height:40px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .key:active{background:var(--card);}
  .key.wide{max-width:48px;font-size:11px;color:var(--ink-dim);}

  .conn{flex-shrink:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-dim);margin-top:2px;padding-bottom:2px;}
  .conn.on::before{content:"● ";color:var(--green);}
  .conn.off::before{content:"● ";color:#e0645f;}  /* Extinction de la page à la complétion totale */
  .fade-out{ transition:opacity 9.3s ease; opacity:0 !important; pointer-events:none; }
  body.blackout{ justify-content:center; align-items:center; background:#000; }
  .reset{ position:relative; z-index:9998; }

  #countdown-overlay{
    position:fixed;inset:0;z-index:9997;
    background:rgba(0,0,0,0.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;padding:20px;
  }
  #countdown-overlay .big-num{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;color:var(--gold);
    line-height:1;
  }
  #countdown-overlay .sub{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);margin-top:8px;
  }
</style>
</head>
<body>

<!-- VERROUILLAGE -->
<div id="lock-screen">
  <div class="lock-box">
    <h2>🔒 Grille Verrouillée</h2>
    <p>Entrez le code pour accéder aux mots fléchés :</p>
    <div class="code-inputs">
      <input type="text" id="code-day" maxlength="2" placeholder="JJ" inputmode="numeric">
      <input type="text" id="code-month" maxlength="2" placeholder="MM" inputmode="numeric">
      <input type="text" id="code-year" maxlength="4" placeholder="AAAA" inputmode="numeric">
    </div>
    <button class="lock-btn" id="unlock-btn">Déverrouiller</button>
    <div class="lock-error" id="lock-error">Code incorrect</div>
  </div>
</div>

<!-- BARRE DE PROGRESSION -->
<div class="top-bar" id="top-bar">
  <div class="progress-info">
    <span>PROGRESSION</span>
    <span id="progress-text">0 / 25 mots</span>
  </div>
  <div class="progress-bg">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="mystery-row" id="mysteryRow"></div>
</div>

<div class="wrap" id="mainWrap">
  <header>
    <h1>Mots Fléchés Géants</h1>
  </header>

  <div class="grid-scroll"><div id="grid"></div></div>

  <div id="win">
    <h2>🎉 Félicitations !</h2>
    <p>Vous avez complété toute la grille !</p>
  </div>

  <div class="conn off" id="connStatus">connexion…</div>
</div>

<div id="keyboard"></div>

<button class="reset" id="resetBtn">↺ Réinitialiser la grille</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9ReBM7oG2VBIgiVapSdKELzeL6VpiVCg",
  authDomain: "poppy-fleche.firebaseapp.com",
  databaseURL: "https://poppy-fleche-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "poppy-fleche",
  storageBucket: "poppy-fleche.firebasestorage.app",
  messagingSenderId: "128884017293",
  appId: "1:128884017293:web:909ca55b7502c768363ac4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cellsRef = db.ref('motfleche/cellules');

const unlockBtn = document.getElementById('unlock-btn');
const lockScreen = document.getElementById('lock-screen');
const topBar = document.getElementById('top-bar');
const lockError = document.getElementById('lock-error');

unlockBtn.addEventListener('click', () => {
  const d = document.getElementById('code-day').value.padStart(2, '0');
  const m = document.getElementById('code-month').value.padStart(2, '0');
  const y = document.getElementById('code-year').value;
  
  if(d === '03' && m === '08' && y === '1996'){
    lockScreen.style.display = 'none';
    topBar.style.display = 'block';
  } else {
    lockError.style.display = 'block';
  }
});

/* DÉFINITIONS ET MAILLAGE INTERCONNECTÉ 
   Chaque mot croise désormais plusieurs autres mots sur des lettres identiques.
*/
// Disposition recalculée automatiquement : chaque case a été vérifiée
// pour garantir qu'aucune lettre n'est jamais recouverte par une case-indice
// ni par une lettre différente d'un autre mot.
const words = [
  { id:0, clue:"Pain montagne", arrow:"↓", cluePos:[6,0], start:[6,1], dir:'V', answer:'PAILLASSE' },
  { id:1, clue:"Chanteur 80'", arrow:"→", cluePos:[0,2], start:[1,2], dir:'H', answer:'GOLDMAN', mystery:true },
  { id:2, clue:"Tonton", arrow:"↓", cluePos:[16,8], start:[16,9], dir:'V', answer:'NARVALO' },
  { id:3, clue:"Canard", arrow:"↓", cluePos:[8,5], start:[8,6], dir:'V', answer:'SARCELLE', mystery:true },
  { id:4, clue:"Prénom ici", arrow:"↓", cluePos:[4,1], start:[4,2], dir:'V', answer:'DAVID' },
  { id:5, clue:"Froid poêle", arrow:"↓", cluePos:[10,4], start:[10,5], dir:'V', answer:'DEGLACER', mystery:true },
  { id:6, clue:"Sécurise grimpeur", arrow:"→", cluePos:[12,5], start:[13,5], dir:'H', answer:'BAUDAR', mystery:true },
  { id:7, clue:"Rabbit", arrow:"→", cluePos:[18,8], start:[19,8], dir:'H', answer:'BUNNY' },
  { id:8, clue:"Main moite", arrow:"↓", cluePos:[10,14], start:[10,15], dir:'V', answer:'POF' },
  { id:9, clue:"Titi", arrow:"↓", cluePos:[12,8], start:[12,9], dir:'V', answer:'THIBAULT' },
  { id:10, clue:"Bière Gwen", arrow:"↓", cluePos:[17,3], start:[17,4], dir:'V', answer:'JADE' },
  { id:11, clue:"100 km", arrow:"↓", cluePos:[14,8], start:[14,9], dir:'V', answer:'MILLAU' },
  { id:12, clue:"Fan cheval", arrow:"→", cluePos:[3,13], start:[4,13], dir:'H', answer:'MATTEO' },
  { id:13, clue:"Maxou", arrow:"→", cluePos:[5,20], start:[6,20], dir:'H', answer:'BIDOU' },
  { id:14, clue:"Collier", arrow:"→", cluePos:[8,16], start:[9,16], dir:'H', answer:'TORTUE' },
  { id:15, clue:"Baby", arrow:"→", cluePos:[14,15], start:[15,15], dir:'H', answer:'LOUTE', mystery:true },
  { id:16, clue:"Pompe", arrow:"↓", cluePos:[15,1], start:[15,2], dir:'V', answer:'INSULINE' },
  { id:17, clue:"Perdrix", arrow:"→", cluePos:[13,2], start:[14,2], dir:'H', answer:'GIBIER' },
  { id:18, clue:"Rameur TV", arrow:"→", cluePos:[15,11], start:[16,11], dir:'H', answer:'RAMEUR', mystery:true },
  { id:19, clue:"Minecraft", arrow:"→", cluePos:[5,9], start:[6,9], dir:'H', answer:'ENCHANTEMENT' },
  { id:20, clue:"BV bourse", arrow:"↓", cluePos:[19,7], start:[19,8], dir:'V', answer:'BUREAU' },
  { id:21, clue:"Joe taxi", arrow:"→", cluePos:[5,23], start:[6,23], dir:'H', answer:'VIDOU' },
  { id:22, clue:"Amateur Sky", arrow:"→", cluePos:[0,4], start:[1,4], dir:'H', answer:'NARVALO' },
  { id:23, clue:"Spike", arrow:"→", cluePos:[4,11], start:[5,11], dir:'H', answer:'BALL' },
  { id:24, clue:"Monter en", arrow:"↓", cluePos:[6,12], start:[6,13], dir:'V', answer:'TETE' },
];

function wordCells(w){
  const [c,r] = w.start;
  return w.answer.split('').map((_,i) => w.dir === 'H' ? [c+i, r] : [c, r+i]);
}

const cellMap = new Map();
const clueMap = new Map();
let maxCol = 0, maxRow = 0;

words.forEach((w, wi) => {
  const [cc, cr] = w.cluePos;
  maxCol = Math.max(maxCol, cc); maxRow = Math.max(maxRow, cr);
  clueMap.set(`${cc}_${cr}`, w);

  const cells = wordCells(w);
  cells.forEach(([c,r], li) => {
    maxCol = Math.max(maxCol, c); maxRow = Math.max(maxRow, r);
    const key = `${c}_${r}`;
    if (!cellMap.has(key)) cellMap.set(key, []);
    cellMap.get(key).push({ wordIdx: wi, letterIdx: li });
  });
});

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${maxCol+1}, 33px)`;
gridEl.style.gridTemplateRows = `repeat(${maxRow+1}, 33px)`;

/* Mot mystère : 6 lettres cibles précises qui épellent A-C-O-R-E-S */
const mysteryTargets = {
  '14_5': { n:1, letter:'A' }, // BAUDAR
  '10_10':{ n:2, letter:'C' }, // DEGLACER
  '2_2':  { n:3, letter:'O' }, // GOLDMAN
  '16_11':{ n:4, letter:'R' }, // RAMEUR
  '19_15':{ n:5, letter:'E' }, // LOUTE
  '8_6':  { n:6, letter:'S' }, // SARCELLE
};
const mysteryOrder = [1,2,3,4,5,6];
const mysteryRowEl = document.getElementById('mysteryRow');
mysteryOrder.forEach(n => {
  mysteryRowEl.insertAdjacentHTML('beforeend', `<div class="mring" id="mring-${n}">?</div>`);
});

for (let r=0; r<=maxRow; r++){
  for (let c=0; c<=maxCol; c++){
    const key = `${c}_${r}`;
    const info = cellMap.get(key);
    const clue = clueMap.get(key);

    const div = document.createElement('div');
    div.style.gridColumn = c+1;
    div.style.gridRow = r+1;

    if (clue) {
      div.className = 'cell clue-cell' + (clue.mystery ? ' locked' : '');
      div.dataset.arrow = clue.arrow;
      div.innerHTML = clue.mystery
        ? `<span class="lock-icon">🔒</span><span class="clue-arrow">${clue.arrow}</span>`
        : `<span>${clue.clue}</span><span class="clue-arrow">${clue.arrow}</span>`;
      clue.clueEl = div;
    } else if (info) {
      div.className = 'cell letter';
      div.id = `cell-${key}`;
      div.innerHTML = `<span class="ltr"></span>`;
      div.addEventListener('click', () => onCellClick(key));
      const target = mysteryTargets[key];
      if (target){
        div.classList.add('target');
        div.insertAdjacentHTML('beforeend', `<span class="mystery-badge">${target.n}</span>`);
      }
    } else {
      div.className = 'cell blocked';
    }
    gridEl.appendChild(div);
  }
}

let currentWord = 0;
let currentPos = 0;

function selectWord(wi, pos){
  currentWord = wi; currentPos = pos;
  document.querySelectorAll('.cell.wordlit').forEach(c => c.classList.remove('wordlit'));
  document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
  
  const cells = wordCells(words[wi]);
  cells.forEach(([c,r]) => document.getElementById(`cell-${c}_${r}`)?.classList.add('wordlit'));
  const [c,r] = cells[pos];
  document.getElementById(`cell-${c}_${r}`)?.classList.add('active');
}

function onCellClick(key){
  const entries = cellMap.get(key);
  if(!entries) return;
  
  const candidates = [...new Set(entries.map(e => e.wordIdx))];
  let wi = candidates.includes(currentWord) && candidates.length > 1 
    ? candidates.find(w => w !== currentWord) 
    : candidates[0];
    
  const entry = entries.find(e => e.wordIdx === wi);
  selectWord(wi, entry.letterIdx);
}

selectWord(0, 0);

/* CLAVIER */
const rows = [
  ['A','Z','E','R','T','Y','U','I','O','P'],
  ['Q','S','D','F','G','H','J','K','L','M'],
  ['⌫','W','X','C','V','B','N','→']
];
const kb = document.getElementById('keyboard');
rows.forEach(r => {
  const rowEl = document.createElement('div');
  rowEl.className = 'kb-row';
  r.forEach(k => {
    const key = document.createElement('div');
    key.className = 'key' + (k === '⌫' || k === '→' ? ' wide' : '');
    key.textContent = k;
    key.addEventListener('click', () => handleKey(k));
    rowEl.appendChild(key);
  });
  kb.appendChild(rowEl);
});

function handleKey(k){
  const cells = wordCells(words[currentWord]);
  if (k === '⌫'){
    const [c,r] = cells[currentPos];
    writeCell(c,r,'');
    if (currentPos > 0) selectWord(currentWord, currentPos - 1);
  } else if (k === '→'){
    if (currentPos < cells.length - 1) selectWord(currentWord, currentPos + 1);
  } else {
    const [c,r] = cells[currentPos];
    writeCell(c,r,k);
    if (currentPos < cells.length - 1) selectWord(currentWord, currentPos + 1);
  }
}

function writeCell(c,r,val){
  cellsRef.child(`${c}_${r}`).set(val.toUpperCase());
}

let localData = {};
cellsRef.on('value', (snapshot) => {
  localData = snapshot.val() || {};
  render();
});

db.ref('.info/connected').on('value', (snap) => {
  const connEl = document.getElementById('connStatus');
  connEl.textContent = snap.val() ? 'connecté en temps réel' : 'connexion…';
  connEl.className = 'conn ' + (snap.val() ? 'on' : 'off');
});

const solvedWords = new Set();
let mysteryClueUnlocked = false;

function spawnConfetti(x, y){
  const colors = ['#5f8ce9','#e0972c','#e8c468','#4caf7d','#ffffff'];
  for (let i=0; i<18; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 70;
    p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(angle) * dist - 20}px`);
    p.style.setProperty('--rot', `${(Math.random()*360)|0}deg`);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    p.style.animation = `confettiFly ${0.6 + Math.random()*0.4}s ease-out forwards`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1100);
  }
}

function celebrateWord(cells){
  let sx=0, sy=0, n=0;
  cells.forEach(([c,r]) => {
    const el = document.getElementById(`cell-${c}_${r}`);
    if (!el) return;
    el.classList.remove('pop');
    void el.offsetWidth; // relance l'animation
    el.classList.add('pop');
    const rect = el.getBoundingClientRect();
    sx += rect.left + rect.width/2; sy += rect.top + rect.height/2; n++;
  });
  if (n>0) spawnConfetti(sx/n, sy/n);
}

function render(){
  cellMap.forEach((_, key) => {
    const el = document.getElementById(`cell-${key}`);
    const ltr = el?.querySelector('.ltr');
    if (ltr) ltr.textContent = localData[key] || '';
  });

  let solvedCount = 0;
  let otherSolvedAll = true;
  words.forEach((w, wi) => {
    const cells = wordCells(w);
    const filled = cells.map(([c,r]) => localData[`${c}_${r}`] || '').join('');
    const isCorrect = filled === w.answer;
    cells.forEach(([c,r]) => {
      document.getElementById(`cell-${c}_${r}`)?.classList.toggle('correct', isCorrect);
    });
    if (isCorrect){
      solvedCount++;
      if (!solvedWords.has(wi)){
        solvedWords.add(wi);
        celebrateWord(cells);
      }
    } else {
      solvedWords.delete(wi);
      if (!w.mystery) otherSolvedAll = false;
    }
  });

  // Révélation des 6 indications mystère uniquement quand tout le reste est trouvé
  words.forEach(w => {
    if (!w.mystery || !w.clueEl) return;
    if (otherSolvedAll){
      if (w.clueEl.classList.contains('locked')){
        w.clueEl.classList.remove('locked');
        w.clueEl.innerHTML = `<span>${w.clue}</span><span class="clue-arrow">${w.arrow}</span>`;
        w.clueEl.classList.add('unlocked');
      }
    } else if (!w.clueEl.classList.contains('locked')){
      w.clueEl.classList.remove('unlocked');
      w.clueEl.classList.add('locked');
      w.clueEl.innerHTML = `<span class="lock-icon">🔒</span><span class="clue-arrow">${w.arrow}</span>`;
    }
  });
  if (otherSolvedAll && !mysteryClueUnlocked){
    mysteryClueUnlocked = true;
  } else if (!otherSolvedAll){
    mysteryClueUnlocked = false;
  }

  // anneaux du mot mystère A-C-O-R-E-S
  Object.entries(mysteryTargets).forEach(([key, t]) => {
    const val = localData[key] || '';
    const ring = document.getElementById(`mring-${t.n}`);
    if (ring){
      if (val === t.letter){
        ring.textContent = val;
        ring.classList.add('found');
      } else {
        ring.textContent = '?';
        ring.classList.remove('found');
      }
    }
  });

  const pct = Math.round((solvedCount / words.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${solvedCount} / ${words.length} mots`;

  const winEl = document.getElementById('win');
  if (solvedCount === words.length){
    winEl.style.display = 'block';
    startShutdown();
  } else {
    winEl.style.display = 'none';
  }
}

let fullyCompleted = false;
let shutdownTimer = null;

function startShutdown(){
  if (fullyCompleted) return;
  fullyCompleted = true;

  const overlay = document.createElement('div');
  overlay.id = 'countdown-overlay';
  overlay.innerHTML = `<div class="big-num" id="cd-num">10</div><div class="sub">La page s'éteint...</div>`;
  document.body.appendChild(overlay);

  const fadeTargets = [
    topBar,
    document.querySelector('header'),
    document.querySelector('.grid-scroll'),
    document.getElementById('win'),
    document.getElementById('keyboard'),
    document.getElementById('connStatus'),
  ].filter(Boolean);
  fadeTargets.forEach(el => el.classList.add('fade-out'));

  let n = 10;
  const cdNum = document.getElementById('cd-num');
  shutdownTimer = setInterval(() => {
    n--;
    if (cdNum) cdNum.textContent = Math.max(n,0);
    if (n <= 0){
      clearInterval(shutdownTimer);
      overlay.remove();
      fadeTargets.forEach(el => { el.style.display = 'none'; });
      document.body.classList.add('blackout');
    }
  }, 1000);
}

function undoShutdown(){
  fullyCompleted = false;
  if (shutdownTimer) clearInterval(shutdownTimer);
  document.getElementById('countdown-overlay')?.remove();
  document.body.classList.remove('blackout');
  topBar.style.display = 'block';
  topBar.classList.remove('fade-out');
  [document.querySelector('header'), document.querySelector('.grid-scroll'),
   document.getElementById('win'), document.getElementById('keyboard'), document.getElementById('connStatus')]
   .forEach(el => { if(!el) return; el.style.display=''; el.classList.remove('fade-out'); });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Réinitialiser la grille pour tout le monde ?')) {
    cellsRef.remove();
    selectWord(0,0);
    undoShutdown();
  }
});
</script>
