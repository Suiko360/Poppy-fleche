<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mots Fléchés Interconnectés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2430;
    --card:#232f3f;
    --card-2:#2b3a4d;
    --ink:#eef1f4;
    --ink-dim:#9fb0c2;
    --gold:#e8c468;
    --green:#4caf7d;
    --line:#324256;
    --clue-bg:#263445;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  
  /* Lock Screen */
  #lock-screen {
    position:fixed;inset:0;background:var(--bg);z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box {
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px;text-align:center;width:100%;max-width:320px;box-shadow:0 10px 25px rgba(0,0,0,0.3);
  }
  .lock-box h2{font-family:'Space Grotesk',sans-serif;margin:0 0 10px;font-size:20px;color:var(--gold);}
  .lock-box p{font-size:13px;color:var(--ink-dim);margin-bottom:20px;}
  .code-inputs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
  .code-inputs input{
    width:55px;height:48px;background:var(--card-2);border:1px solid var(--line);
    border-radius:8px;color:#fff;text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:18px;font-weight:700;
  }
  .lock-btn{
    width:100%;background:var(--gold);color:#121820;border:none;padding:12px;
    border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
  }
  .lock-error{color:#e0645f;font-size:12px;margin-top:10px;display:none;}

  /* Floating Progress Bar */
  .top-bar {
    position:sticky;top:0;left:0;right:0;z-index:100;
    background:rgba(27,36,48,0.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px;display:none;
  }
  .progress-info{display:flex;justify-content:space-between;font-size:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:6px;}
  .progress-bg{width:100%;height:8px;background:var(--card-2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg, var(--gold), var(--green));transition:width 0.3s ease;}

  /* Main Container */
  .wrap{width:100%;max-width:100vw;margin:0 auto;padding:16px 8px 120px;display:flex;flex-direction:column;align-items:center;}
  header{text-align:center;margin-bottom:12px;}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0;font-weight:700;}

  /* Grid Layout */
  .grid-scroll{width:100%;overflow-x:auto;padding:10px;display:flex;justify-content:center;}
  #grid{display:grid;gap:2px;margin:0 auto;width:max-content;background:var(--line);padding:2px;border-radius:8px;}
  
  .cell{
    width:40px;height:40px;border-radius:3px;display:flex;align-items:center;
    justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
    position:relative;user-select:none;
  }
  .cell.letter{background:var(--card-2);color:var(--ink);cursor:pointer;transition:background 0.1s;}
  .cell.blocked{background:var(--bg);}
  
  /* Cases d'indices */
  .cell.clue-cell{
    background:var(--clue-bg);
    font-size:7px;line-height:1;text-align:center;padding:1px;
    color:var(--gold);font-weight:600;display:flex;flex-direction:column;
    align-items:center;justify-content:center;word-break:break-word;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
  }
  .clue-arrow{font-size:10px;color:var(--gold);margin-top:1px;font-weight:bold;}
  
  .cell.active{background:#fff!important;color:#121820!important;box-shadow:0 0 8px rgba(255,255,255,0.8);z-index:2;}
  .cell.wordlit:not(.active){background:#3b4f68;}
  .cell.correct{background:rgba(76,175,125,0.3)!important;color:#85f0b5!important;}

  #win{display:none;text-align:center;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:16px;margin:16px 0;width:100%;max-width:400px;}
  #win h2{font-family:'Space Grotesk',sans-serif;color:var(--gold);margin:0 0 4px;font-size:18px;}

  .reset{display:block;margin:12px auto;background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:16px;cursor:pointer;}

  /* Keyboard */
  #keyboard{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--bg);border-top:1px solid var(--line);padding:8px 4px calc(env(safe-area-inset-bottom,4px) + 4px);}
  .kb-row{display:flex;justify-content:center;gap:3px;margin-bottom:4px;}
  .key{flex:1;max-width:36px;height:42px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .key:active{background:var(--card);}
  .key.wide{max-width:50px;font-size:11px;color:var(--ink-dim);}

  .conn{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);margin-top:6px;}
  .conn.on::before{content:"● ";color:var(--green);}
  .conn.off::before{content:"● ";color:#e0645f;}
</style>
</head>
<body>

<!-- VERROUILLAGE -->
<div id="lock-screen">
  <div class="lock-box">
    <h2>🔒 Grille Verrouillée</h2>
    <p>Entrez le code pour accéder aux mots fléchés :</p>
    <div class="code-inputs">
      <input type="text" id="code-day" maxlength="2" placeholder="JJ" inputmode="numeric">
      <input type="text" id="code-month" maxlength="2" placeholder="MM" inputmode="numeric">
      <input type="text" id="code-year" maxlength="4" placeholder="AAAA" inputmode="numeric">
    </div>
    <button class="lock-btn" id="unlock-btn">Déverrouiller</button>
    <div class="lock-error" id="lock-error">Code incorrect</div>
  </div>
</div>

<!-- BARRE DE PROGRESSION -->
<div class="top-bar" id="top-bar">
  <div class="progress-info">
    <span>PROGRESSION</span>
    <span id="progress-text">0 / 25 mots</span>
  </div>
  <div class="progress-bg">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>Mots Fléchés Géants</h1>
  </header>

  <div class="grid-scroll"><div id="grid"></div></div>

  <div id="win">
    <h2>🎉 Félicitations !</h2>
    <p>Vous avez complété toute la grille !</p>
  </div>

  <button class="reset" id="resetBtn">↺ Réinitialiser la grille</button>
  <div class="conn off" id="connStatus">connexion…</div>
</div>

<div id="keyboard"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9ReBM7oG2VBIgiVapSdKELzeL6VpiVCg",
  authDomain: "poppy-fleche.firebaseapp.com",
  databaseURL: "https://poppy-fleche-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "poppy-fleche",
  storageBucket: "poppy-fleche.firebasestorage.app",
  messagingSenderId: "128884017293",
  appId: "1:128884017293:web:909ca55b7502c768363ac4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cellsRef = db.ref('motfleche/cellules');

const unlockBtn = document.getElementById('unlock-btn');
const lockScreen = document.getElementById('lock-screen');
const topBar = document.getElementById('top-bar');
const lockError = document.getElementById('lock-error');

unlockBtn.addEventListener('click', () => {
  const d = document.getElementById('code-day').value.padStart(2, '0');
  const m = document.getElementById('code-month').value.padStart(2, '0');
  const y = document.getElementById('code-year').value;
  
  if(d === '03' && m === '08' && y === '1996'){
    lockScreen.style.display = 'none';
    topBar.style.display = 'block';
  } else {
    lockError.style.display = 'block';
  }
});

/* DÉFINITIONS ET MAILLAGE INTERCONNECTÉ 
   Chaque mot croise désormais plusieurs autres mots sur des lettres identiques.
*/
const words = [
  // COEUR DE LA GRILLE (Croisements multiples : PAILLASSE, GOLDMAN, NARVALO, SARCELLE, etc.)
  { id:0, clue:"Pain montagne", arrow:"↓", cluePos:[3,1], start:[3,2], dir:'V', answer:'PAILLASSE' },
  { id:1, clue:"Chanteur 80'", arrow:"→", cluePos:[1,3], start:[2,3], dir:'H', answer:'GOLDMAN' },
  { id:2, clue:"Tonton", arrow:"↓", cluePos:[8,1], start:[8,2], dir:'V', answer:'NARVALO' },
  { id:3, clue:"Canard", arrow:"→", cluePos:[1,7], start:[2,7], dir:'H', answer:'SARCELLE' },
  { id:4, clue:"Prénom ici", arrow:"→", cluePos:[2,9], start:[3,9], dir:'H', answer:'DAVID' },
  
  // EXTENSION GAUCHE : DEGLACER x BAUDAR x BUNNY x POF
  { id:5, clue:"Froid poêle", arrow:"↓", cluePos:[1,1], start:[1,2], dir:'V', answer:'DEGLACER' },
  { id:6, clue:"Sécurise grimpeur", arrow:"→", cluePos:[0,6], start:[1,6], dir:'H', answer:'BAUDAR' },
  { id:7, clue:"Rabbit", arrow:"→", cluePos:[0,11], start:[1,11], dir:'H', answer:'BUNNY' },
  { id:8, clue:"Main moite", arrow:"↓", cluePos:[3,10], start:[3,11], dir:'V', answer:'POF' },

  // EXTENSION DROITE : THIBAULT x JADE x MILLAU x MATTEO
  { id:9, clue:"Titi", arrow:"→", cluePos:[8,3], start:[9,3], dir:'H', answer:'THIBAULT' },
  { id:10, clue:"Bière Gwen", arrow:"↓", cluePos:[13,2], start:[13,3], dir:'V', answer:'JADE' },
  { id:11, clue:"100 km", arrow:"→", cluePos:[8,7], start:[9,7], dir:'H', answer:'MILLAU' },
  { id:12, clue:"Fan cheval", arrow:"↓", cluePos:[9,6], start:[9,7], dir:'V', answer:'MATTEO' },

  // NORD-OUEST : BIDOU x TORTUE x LOUTE
  { id:13, clue:"Maxou", arrow:"↓", cluePos:[5,0], start:[5,1], dir:'V', answer:'BIDOU' },
  { id:14, clue:"Collier", arrow:"→", cluePos:[1,4], start:[2,4], dir:'H', answer:'TORTUE' },
  { id:15, clue:"Baby", arrow:"→", cluePos:[1,13], start:[2,13], dir:'H', answer:'LOUTE' },

  // SUD : INSULINE x GIBIER x RAMEUR x ENCHANTEMENT
  { id:16, clue:"Pompe", arrow:"↓", cluePos:[5,6], start:[5,7], dir:'V', answer:'INSULINE' },
  { id:17, clue:"Perdrix", arrow:"→", cluePos:[4,12], start:[5,12], dir:'H', answer:'GIBIER' },
  { id:18, clue:"Rameur TV", arrow:"→", cluePos:[5,14], start:[6,14], dir:'H', answer:'RAMEUR' },
  { id:19, clue:"Minecraft", arrow:"↓", cluePos:[9,11], start:[9,12], dir:'V', answer:'ENCHANTEMENT' },

  // OUEST & SUD-OUEST : BUREAU x VIDOU x MOTS DE FIN
  { id:20, clue:"BV bourse", arrow:"↓", cluePos:[7,9], start:[7,10], dir:'V', answer:'BUREAU' },
  { id:21, clue:"Joe taxi", arrow:"→", cluePos:[6,11], start:[7,11], dir:'H', answer:'VIDOU' },
  { id:22, clue:"Amateur Sky", arrow:"→", cluePos:[2,15], start:[3,15], dir:'H', answer:'NARVALO' },
  { id:23, clue:"Spike", arrow:"→", cluePos:[1,17], start:[2,17], dir:'H', answer:'BALL' },
  { id:24, clue:"Monter en", arrow:"→", cluePos:[6,17], start:[7,17], dir:'H', answer:'TETE' }
];

function wordCells(w){
  const [c,r] = w.start;
  return w.answer.split('').map((_,i) => w.dir === 'H' ? [c+i, r] : [c, r+i]);
}

const cellMap = new Map();
const clueMap = new Map();
let maxCol = 0, maxRow = 0;

words.forEach((w, wi) => {
  const [cc, cr] = w.cluePos;
  maxCol = Math.max(maxCol, cc); maxRow = Math.max(maxRow, cr);
  clueMap.set(`${cc}_${cr}`, w);

  const cells = wordCells(w);
  cells.forEach(([c,r], li) => {
    maxCol = Math.max(maxCol, c); maxRow = Math.max(maxRow, r);
    const key = `${c}_${r}`;
    if (!cellMap.has(key)) cellMap.set(key, []);
    cellMap.get(key).push({ wordIdx: wi, letterIdx: li });
  });
});

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${maxCol+1}, 40px)`;
gridEl.style.gridTemplateRows = `repeat(${maxRow+1}, 40px)`;

for (let r=0; r<=maxRow; r++){
  for (let c=0; c<=maxCol; c++){
    const key = `${c}_${r}`;
    const info = cellMap.get(key);
    const clue = clueMap.get(key);

    const div = document.createElement('div');
    div.style.gridColumn = c+1;
    div.style.gridRow = r+1;

    if (clue) {
      div.className = 'cell clue-cell';
      div.innerHTML = `<span>${clue.clue}</span><span class="clue-arrow">${clue.arrow}</span>`;
    } else if (info) {
      div.className = 'cell letter';
      div.id = `cell-${key}`;
      div.addEventListener('click', () => onCellClick(key));
    } else {
      div.className = 'cell blocked';
    }
    gridEl.appendChild(div);
  }
}

let currentWord = 0;
let currentPos = 0;

function selectWord(wi, pos){
  currentWord = wi; currentPos = pos;
  document.querySelectorAll('.cell.wordlit').forEach(c => c.classList.remove('wordlit'));
  document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
  
  const cells = wordCells(words[wi]);
  cells.forEach(([c,r]) => document.getElementById(`cell-${c}_${r}`)?.classList.add('wordlit'));
  const [c,r] = cells[pos];
  document.getElementById(`cell-${c}_${r}`)?.classList.add('active');
}

function onCellClick(key){
  const entries = cellMap.get(key);
  if(!entries) return;
  
  const candidates = [...new Set(entries.map(e => e.wordIdx))];
  let wi = candidates.includes(currentWord) && candidates.length > 1 
    ? candidates.find(w => w !== currentWord) 
    : candidates[0];
    
  const entry = entries.find(e => e.wordIdx === wi);
  selectWord(wi, entry.letterIdx);
}

selectWord(0, 0);

/* CLAVIER */
const rows = [
  ['A','Z','E','R','T','Y','U','I','O','P'],
  ['Q','S','D','F','G','H','J','K','L','M'],
  ['⌫','W','X','C','V','B','N','→']
];
const kb = document.getElementById('keyboard');
rows.forEach(r => {
  const rowEl = document.createElement('div');
  rowEl.className = 'kb-row';
  r.forEach(k => {
    const key = document.createElement('div');
    key.className = 'key' + (k === '⌫' || k === '→' ? ' wide' : '');
    key.textContent = k;
    key.addEventListener('click', () => handleKey(k));
    rowEl.appendChild(key);
  });
  kb.appendChild(rowEl);
});

function handleKey(k){
  const cells = wordCells(words[currentWord]);
  if (k === '⌫'){
    const [c,r] = cells[currentPos];
    writeCell(c,r,'');
    if (currentPos > 0) selectWord(currentWord, currentPos - 1);
  } else if (k === '→'){
    if (currentPos < cells.length - 1) selectWord(currentWord, currentPos + 1);
  } else {
    const [c,r] = cells[currentPos];
    writeCell(c,r,k);
    if (currentPos < cells.length - 1) selectWord(currentWord, currentPos + 1);
  }
}

function writeCell(c,r,val){
  cellsRef.child(`${c}_${r}`).set(val.toUpperCase());
}

let localData = {};
cellsRef.on('value', (snapshot) => {
  localData = snapshot.val() || {};
  render();
});

db.ref('.info/connected').on('value', (snap) => {
  const connEl = document.getElementById('connStatus');
  connEl.textContent = snap.val() ? 'connecté en temps réel' : 'connexion…';
  connEl.className = 'conn ' + (snap.val() ? 'on' : 'off');
});

function render(){
  cellMap.forEach((_, key) => {
    const el = document.getElementById(`cell-${key}`);
    if (el) el.textContent = localData[key] || '';
  });

  let solvedCount = 0;
  words.forEach((w) => {
    const cells = wordCells(w);
    const filled = cells.map(([c,r]) => localData[`${c}_${r}`] || '').join('');
    const isCorrect = filled === w.answer;
    cells.forEach(([c,r]) => {
      if(isCorrect) document.getElementById(`cell-${c}_${r}`)?.classList.add('correct');
    });
    if (isCorrect) solvedCount++;
  });

  const pct = Math.round((solvedCount / words.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${solvedCount} / ${words.length} mots`;

  const winEl = document.getElementById('win');
  if (solvedCount === words.length){
    winEl.style.display = 'block';
  } else {
    winEl.style.display = 'none';
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Réinitialiser la grille pour tout le monde ?')) {
    cellsRef.remove();
    selectWord(0,0);
  }
});
</script>
</body>
</html>
